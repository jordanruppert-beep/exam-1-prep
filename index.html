<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACG5026 - Exam 1 Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #011426;
  --bg-grid: rgba(92, 124, 138, 0.05);
  --card: #0B2A38;
  --card-hi: #123A4C;
  --border: rgba(92, 124, 138, 0.28);
  --border-soft: rgba(92, 124, 138, 0.16);
  --ink: #F3F7F9;
  --ink-soft: #9DB2BC;
  --ink-faint: #6C8391;
  --accent: #5C7C8A;
  --accent-bright: #86AAB8;
  --teal: #1F4959;
  --charcoal: #242424;
  --green: #46C89B;
  --green-bg: rgba(70, 200, 155, 0.14);
  --green-border: rgba(70, 200, 155, 0.5);
  --red: #E0705F;
  --red-bg: rgba(224, 112, 95, 0.15);
  --red-border: rgba(224, 112, 95, 0.5);
  --shadow-sm: 0 1px 0 rgba(0,0,0,0.2), 0 2px 8px rgba(0,0,0,0.28);
  --shadow-md: 0 1px 0 rgba(0,0,0,0.2), 0 18px 40px -12px rgba(0,0,0,0.55);
  --radius: 6px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
body {
  background-image:
    radial-gradient(var(--bg-grid) 0.7px, transparent 0.7px),
    radial-gradient(1200px 600px at 80% -5%, rgba(31,73,89,0.5), transparent 70%);
  background-size: 6px 6px, 100% 100%;
  min-height: 100vh;
}
h1, h2, h3 { font-family: 'Spectral', Georgia, serif; margin: 0; }
p { margin: 0; }
button { font-family: inherit; }
::selection { background: var(--accent); color: #fff; }

.page {
  position: relative; max-width: 820px; margin: 0 auto;
  padding: 34px 26px 90px 40px;
  border-left: 1px solid var(--border-soft);
  min-height: 100vh;
}
@media (max-width: 640px) { .page { padding: 22px 14px 60px 18px; } }

.site-header { padding: 44px 0 0; }
.brand { display: flex; align-items: flex-start; gap: 16px; }
.brand-mark {
  flex: none; width: 48px; height: 48px; border-radius: 50%;
  border: 1.5px solid var(--accent); display: flex; align-items: center; justify-content: center;
  font-family: 'Spectral', serif; font-size: 22px; font-weight: 600;
  color: var(--accent-bright); background: var(--card); box-shadow: var(--shadow-sm);
}
.brand-text h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
.brand-text p { margin-top: 6px; font-size: 14.5px; color: var(--ink-soft); max-width: 46ch; }
.brand-text p.brand-by {
  margin-top: 9px; font-family: 'Spectral', serif; font-weight: 600;
  font-size: 15.5px; color: var(--accent-bright); letter-spacing: 0.005em;
}
.header-rule {
  height: 1px; margin: 26px 0 30px;
  background: linear-gradient(90deg, var(--accent), transparent);
  opacity: 0.8;
}
.screen { padding-top: 2px; }
.screen-enter { animation: fadeUp .38s cubic-bezier(.2,.8,.3,1); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.intro-card {
  position: relative; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px 24px 22px 26px;
  box-shadow: var(--shadow-md); margin-bottom: 32px;
}
.intro-card::before {
  content: ""; position: absolute; left: -1px; top: 18px; bottom: 18px;
  width: 3px; background: var(--accent); border-radius: 2px;
}
.intro-kicker {
  font-family: 'Spectral', serif; font-weight: 600; font-style: italic;
  color: var(--accent-bright); font-size: 15px; margin-bottom: 9px;
}
.intro-text { font-size: 15.5px; line-height: 1.6; color: var(--ink); }

.section-label {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--accent-bright); font-weight: 700; margin: 22px 0 10px;
}
.section-label:first-of-type { margin-top: 0; }

.mode-list { display: flex; flex-direction: column; gap: 8px; }
.mode-row {
  display: flex; align-items: center; flex-wrap: wrap; gap: 14px; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 15px 17px; cursor: pointer; box-shadow: var(--shadow-sm); color: var(--ink);
  transition: border-color .15s ease, box-shadow .15s ease, transform .12s ease, background .15s ease;
}
.mode-row:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-md); background: var(--card-hi); }
.mode-row:disabled { cursor: not-allowed; opacity: 0.45; }
.mode-num {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  border: 1.5px solid var(--accent); display: flex; align-items: center; justify-content: center;
  font-size: 12.5px; font-weight: 700; color: var(--accent-bright);
}
.mode-info { flex: 1; }
.mode-name { font-family: 'Spectral', serif; font-size: 17px; font-weight: 600; color: var(--ink); }
.mode-meta { font-size: 12.5px; color: var(--ink-faint); margin-top: 3px; }
.mode-tag {
  flex: none; margin-left: auto; white-space: nowrap; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em;
  font-weight: 700; color: var(--ink-faint); border: 1px solid var(--border);
  padding: 3px 8px; border-radius: 3px;
}
.mode-tag.hard { color: var(--red); border-color: var(--red-border); }

.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; flex-wrap: wrap; gap: 8px; }
.topbar-label { font-size: 13.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.link-btn {
  background: none; border: none; color: var(--ink-soft); text-decoration: underline;
  text-decoration-color: var(--accent); text-underline-offset: 3px; cursor: pointer;
  padding: 2px 0; font-size: 13.5px;
  transition: color .12s ease, text-decoration-color .12s ease;
}
.link-btn:hover { color: var(--accent-bright); text-decoration-color: var(--accent-bright); }
.link-btn.subtle { font-size: 14px; text-decoration: none; }
.link-btn.subtle:hover { text-decoration: underline; }
.link-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.stamp-btn {
  position: relative; background: transparent; border: 2px solid var(--accent); color: var(--accent-bright);
  font-family: 'Spectral', serif; font-weight: 700; font-size: 16px; letter-spacing: 0.02em;
  padding: 13px 26px; border-radius: 5px; cursor: pointer;
  transition: transform .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
}
.stamp-btn:hover:not(:disabled) { background: var(--accent); color: #fff; box-shadow: 0 10px 24px -8px rgba(92,124,138,0.6); transform: translateY(-1px); }
.stamp-btn:active:not(:disabled) { transform: scale(0.99); }
.start-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 6px; }
.nav-row { display: flex; justify-content: flex-end; margin-top: 20px; gap: 12px; align-items: center; }

.live-score {
  font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums;
  background: var(--card); border: 1px solid var(--border); border-radius: 4px;
  padding: 8px 13px; margin-bottom: 16px; display: inline-block;
}

/* practice problems: financial statements + reveal */
.prob-title {
  font-family: 'Spectral', serif; font-weight: 600; font-size: 20px; text-align: center;
  color: var(--ink); margin-bottom: 18px;
}
.prob-instr {
  font-size: 15px; line-height: 1.6; color: var(--ink); margin-bottom: 24px;
}
.fs-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px 26px; box-shadow: var(--shadow-md); margin-bottom: 22px;
}
.fs-wrap { overflow-x: auto; }
.fs-block { margin: 0 0 26px; }
.fs-block:last-child { margin-bottom: 0; }
.fs-table {
  font-family: 'Spectral', Georgia, serif; border-collapse: collapse;
  font-variant-numeric: tabular-nums; font-size: 15.5px; color: var(--ink);
  min-width: 380px;
}
.fs-table.two-col { min-width: 440px; }
.fs-table td { padding: 3px 10px; white-space: nowrap; }
.fs-table td.lbl { padding-right: 40px; white-space: normal; }
.fs-table td.amt { text-align: right; width: 110px; }
.fs-table tr.head td { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; color: var(--accent-bright); border-bottom: 1.5px solid var(--accent); }
.fs-table tr.head td.section { text-decoration: underline; text-underline-offset: 3px; font-family: 'Spectral', serif; font-size: 16px; color: var(--ink); border-bottom: none; }
.fs-table tr.indent td.lbl { padding-left: 26px; }
.fs-table tr.rule td.amt { border-bottom: 1px solid var(--ink-soft); }
.fs-table tr.total td.amt { border-top: 1px solid var(--ink-soft); }
.fs-table tr.grand td.amt { border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); font-weight: 700; }
.fs-spacer td { height: 12px; }

.reveal-btn {
  display: block; width: 100%; text-align: center; cursor: pointer;
  background: var(--accent); color: #fff; border: none; border-radius: 5px;
  font-family: 'Spectral', serif; font-weight: 700; font-size: 17px; letter-spacing: 0.01em;
  padding: 16px 20px; margin: 6px 0 22px;
  transition: background .14s ease, transform .1s ease, box-shadow .14s ease;
}
.reveal-btn:hover { background: var(--accent-bright); box-shadow: 0 12px 26px -10px rgba(92,124,138,0.7); }
.reveal-btn:active { transform: scale(0.995); }

.newnum-btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  background: transparent; color: var(--accent-bright);
  border: 2px solid var(--accent); border-radius: 5px;
  font-family: 'Spectral', serif; font-weight: 700; font-size: 16px; letter-spacing: 0.01em;
  padding: 12px 22px; margin: 4px 0 14px;
  transition: background .14s ease, color .14s ease, box-shadow .14s ease, transform .1s ease;
}
.newnum-btn:hover { background: var(--accent); color: #fff; box-shadow: 0 10px 24px -10px rgba(92,124,138,0.7); transform: translateY(-1px); }
.newnum-btn:active { transform: scale(0.99); }

.answer-key { animation: fadeUp .34s ease; }
.answer-key-head {
  font-family: 'Spectral', serif; font-weight: 700; font-size: 19px; color: var(--ink);
  margin-bottom: 6px;
}
.answer-key-sub { font-size: 14px; color: var(--ink-soft); margin-bottom: 20px; }
.ak-card {
  background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--accent);
  border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow-sm); margin-bottom: 18px;
}
.ak-method { font-family: 'Spectral', serif; font-weight: 700; font-size: 17px; color: var(--accent-bright); margin-bottom: 14px; }
.ak-table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14.5px; color: var(--ink); width: 100%; min-width: 340px; }
.ak-table td { padding: 5px 8px; vertical-align: top; }
.ak-table td.lbl { padding-right: 24px; }
.ak-table td.amt { text-align: right; white-space: nowrap; width: 96px; font-family: 'Spectral', serif; }
.ak-table td.work { font-size: 12.5px; color: var(--ink-soft); font-style: italic; padding-left: 6px; }
.ak-table tr.total td { border-top: 1px solid var(--ink); font-weight: 700; }
.ak-table tr.total td.amt { border-bottom: 3px double var(--ink); }
.ak-note { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin-top: 14px; }
.ak-note strong { color: var(--accent-bright); }

.txn-list { margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.9; color: var(--ink); }
.txn-list li { padding-left: 3px; }
.je-table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink); width: 100%; min-width: 360px; }
.je-table th { font-family: 'Inter', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-bright); font-weight: 700; padding: 0 8px 8px; border-bottom: 1.5px solid var(--accent); text-align: left; }
.je-table th.num { text-align: right; }
.je-table td { padding: 4px 8px; }
.je-table td.je-ref { width: 40px; font-weight: 700; color: var(--ink-soft); }
.je-table td.je-acct { min-width: 170px; }
.je-table td.je-num { text-align: right; width: 92px; font-family: 'Spectral', serif; white-space: nowrap; }
.je-table tr.memo-row td { padding: 2px 8px 11px; }
.je-memo { font-size: 12.5px; color: var(--ink-faint); font-style: italic; }

.rat { padding: 14px 0; border-bottom: 1px solid var(--border-soft); }
.rat:last-child { border-bottom: none; }
.rat-name { font-family: 'Spectral', serif; font-weight: 700; font-size: 16px; color: var(--ink); margin-bottom: 6px; }
.rat-line { font-size: 14px; line-height: 1.6; color: var(--ink-soft); }
.rat-line .num { color: var(--ink); font-variant-numeric: tabular-nums; }
.rat-result { font-size: 15px; font-weight: 700; color: var(--accent-bright); margin-top: 4px; font-variant-numeric: tabular-nums; }
.rat-list { margin: 8px 0 0; padding-left: 20px; }
.rat-list li { margin-bottom: 6px; font-size: 14.5px; line-height: 1.5; }

/* flashcards */
.flash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 4px; }
.flash-grid.wide { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.flash-card { position: relative; height: 190px; perspective: 1300px; cursor: pointer; }
.flash-card.tall { height: 300px; }
.flash-inner {
  position: relative; width: 100%; height: 100%; transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
  transform-style: preserve-3d;
}
.flash-card.flipped .flash-inner { transform: rotateY(180deg); }
.flash-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: var(--radius); border: 1px solid var(--border); background: var(--card);
  box-shadow: var(--shadow-sm); padding: 20px 18px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; gap: 9px; overflow: auto;
}
.flash-front { background: linear-gradient(160deg, var(--card-hi), var(--card)); }
.flash-back { transform: rotateY(180deg); background: var(--card); text-align: left; align-items: stretch; justify-content: flex-start; }
.flash-name { font-family: 'Spectral', serif; font-weight: 600; font-size: 17px; line-height: 1.34; margin: 0; color: var(--ink); }
.flash-name.small { font-size: 12.5px; color: var(--accent-bright); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; font-family: 'Inter', sans-serif; font-weight: 700; }
.flash-hint { font-size: 11.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.07em; margin: 0; }
.flash-formula { font-size: 15px; line-height: 1.5; margin: 0; color: var(--ink); }
.flash-frac { display: inline-flex; flex-direction: column; align-items: center; }
.flash-frac .fnum, .flash-frac .fden { padding: 0 3px; }
.flash-frac .fbar { width: 100%; height: 1.5px; background: var(--ink); margin: 3px 0; }
.flash-note { font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin: 6px 0 0; }
/* objective back content */
.obj-back { font-size: 13.5px; line-height: 1.55; color: var(--ink); }
.obj-back ul, .obj-back ol { margin: 6px 0 0; padding-left: 19px; }
.obj-back li { margin-bottom: 7px; }
.obj-back li:last-child { margin-bottom: 0; }
.obj-back .sub { color: var(--ink-soft); }
.obj-back strong { color: var(--accent-bright); }

.flash-btn {
  border: 1.5px solid var(--border); background: var(--card); border-radius: 4px;
  padding: 9px 17px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--ink-soft);
  transition: border-color .14s ease, color .14s ease, background .14s ease;
}
.flash-btn:hover { border-color: var(--accent); color: var(--ink); }
.flash-btn.know.checked { border-color: var(--green-border); background: var(--green-bg); color: var(--green); }
.flash-btn.miss.checked { border-color: var(--red-border); background: var(--red-bg); color: var(--red); }

button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 640px) {
  .flash-grid, .flash-grid.wide { grid-template-columns: 1fr; }
  .flash-card { height: 176px; }
  .flash-card.tall { height: 320px; }
  .brand-text h1 { font-size: 24px; }
}
</style>
</head>

</div>
<script>
"use strict";
var app = document.getElementById("app");

function h(html) { var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function rnd(min, max, step) { step = step || 1; var n = Math.floor(Math.random() * ((max - min) / step + 1)); return min + n * step; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function fmt(n) {
  if (n === null || isNaN(n)) return "";
  var neg = n < 0, s = Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return neg ? "(" + s + ")" : s;
}
function matchText() { return true; } // placeholder, unused in flashcards-only build
function scrollTop() { try { window.scrollTo({ top: 0, behavior: "auto" }); } catch (e) {} }
function render(node) {
  app.innerHTML = "";
  node.classList.add("screen", "screen-enter");
  app.appendChild(node);
  scrollTop();
}

/* =========================================================
   DATA
   ========================================================= */

// ---- Chapter 1 objective flashcards ----
// front = the learning objective, backHtml = the answer
var CH1_OBJECTIVES = [
  { name: "Define an asset",
    backHtml: '<div class="obj-back"><p>Something you own that provides future economic benefit.</p></div>' },
  { name: "What is a liability?",
    backHtml: '<div class="obj-back"><p>A future economic sacrifice, or something that you owe.</p></div>' },
  { name: "What does it mean to capitalize something?",
    backHtml: '<div class="obj-back"><p>To classify something as an asset.</p></div>' },
  { name: "What is an expense?",
    backHtml: '<div class="obj-back"><p>The use of assets to generate revenues. An expired asset, or the using up of an asset. It shows up on the income statement.</p></div>' },
  { name: "What is a revenue?",
    backHtml: '<div class="obj-back"><p>Increases in net assets that result from business activities.</p></div>' },
  { name: "Discuss the general uses of accounting and who uses it",
    backHtml: '<div class="obj-back"><ul>' +
      '<li><strong>Accounting</strong> is the process of recording, summarizing, and analyzing financial transactions for the purpose of economic decision making.</li>' +
      '<li>Used <strong>internally</strong> by management and <strong>externally</strong> by shareholders, regulatory agencies, potential employees, creditors, and customers.</li>' +
      '</ul></div>' },
  { name: "Discuss the advantages and disadvantages of the corporate entity form",
    backHtml: '<div class="obj-back"><ul>' +
      '<li><strong>Advantages:</strong> limited liability, ability to raise capital, separate ownership from management, transferability of ownership.</li>' +
      '<li><strong>Disadvantages:</strong> double taxation, paperwork and formalities.</li>' +
      '</ul></div>' },
  { name: "Relate the three basic business activities to the financial statements",
    backHtml: '<div class="obj-back"><ul>' +
      '<li><strong>Operating Activities:</strong> found in the Income Statement, Statement of Stockholder\u2019s Equity, and the Statement of Cash Flows.</li>' +
      '<li><strong>Investing Activities:</strong> shown on the Balance Sheet and the Statement of Cash Flows.</li>' +
      '<li><strong>Financing Activities:</strong> shown on the Balance Sheet, Statement of Stockholder\u2019s Equity, Income Statement, and the Statement of Cash Flows.</li>' +
      '</ul></div>' },
  { name: "Describe the institutions that regulate financial accounting and their role in establishing GAAP",
    backHtml: '<div class="obj-back"><ul>' +
      '<li>The <strong>Securities &amp; Exchange Commission (SEC)</strong> regulates the issuance and trading of securities in the U.S.</li>' +
      '<li>The SEC developed the <strong>Financial Accounting Standards Board (FASB)</strong>, which establishes accounting standards (GAAP) in the U.S.</li>' +
      '<li>The <strong>Public Company Accounting Oversight Board (PCAOB)</strong> approves auditing standards and monitors the quality of financial statements and audits.</li>' +
      '</ul></div>' },
  { name: "Describe what an audit opinion says",
    backHtml: '<div class="obj-back"><ul>' +
      '<li>It expresses an opinion as to whether the financial statements <strong>present fairly</strong> the financial activities of the company, and whether the financials were prepared in accordance with GAAP.</li>' +
      '</ul></div>' },
  { name: "Identify the four financial statements and their components and discuss how they are related",
    backHtml: '<div class="obj-back"><ul>' +
      '<li><strong>Balance Sheet:</strong> lists the company\u2019s investments and sources of financing using the accounting equation, Assets = Liabilities + Equity. <span class="sub">Income Statement feeds into Retained Earnings; Statement of Stockholder\u2019s Equity represents Contributed Capital.</span></li>' +
      '<li><strong>Income Statement:</strong> reports the results of a company\u2019s operating activities over a period of time. <span class="sub">Net Income feeds into Retained Earnings on the Balance Sheet.</span></li>' +
      '<li><strong>Statement of Cash Flows:</strong> reports net cash flows from operating, investing, and financing activities over a period of time. <span class="sub">Uses information from the Balance Sheet and Income Statement.</span></li>' +

/* =========================================================

   ========================================================= */
function showHome() {
  var wrap = document.createElement("div");

  var lastGroup = null, list = null;
  MODES.forEach(function (m, i) {
    if (m.group !== lastGroup) {
      wrap.appendChild(h('<p class="section-label">' + escapeHtml(m.group) + '</p>'));
      list = h('<div class="mode-list"></div>');
      wrap.appendChild(list);
      lastGroup = m.group;
    }
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "mode-row";
    btn.innerHTML =
      '<span class="mode-num">' + (i + 1) + '</span>' +
      '<span class="mode-info"><span class="mode-name">' + escapeHtml(m.name) + '</span>' +
      '<span class="mode-meta">' + escapeHtml(m.meta) + '</span></span>' +
      (m.tag ? '<span class="mode-tag">' + escapeHtml(m.tag) + '</span>' : "");
    btn.addEventListener("click", function () { launch(m); });
    list.appendChild(btn);
  });
  render(wrap);
}

function launch(mode) {
  if (mode.kind === "objFlash") startObjectiveFlash(mode);
  else if (mode.kind === "formulaFlash") startFormulaFlash(mode);
  else if (mode.kind === "ocfProblem") startOperatingCFProblem(mode);
  else if (mode.kind === "dcfProblem") startDirectCFProblem(mode);
  else if (mode.kind === "txnProblem") startTransactionsProblem(mode);
  else if (mode.kind === "adjProblem") startAdjustmentsProblem(mode);
  else if (mode.kind === "closeProblem") startClosingProblem(mode);
  else if (mode.kind === "ratioProblem") startRatiosProblem(mode);
}

function homeLink() {
  var b = document.createElement("button");
  b.type = "button";
  b.className = "link-btn subtle";
  b.innerHTML = "&larr; All decks";
  b.addEventListener("click", showHome);
  return b;
}

   ========================================================= */
function buildObjCard(cardData) {
  var outer = h('<div class="flash-card tall"></div>');
  var inner = h('<div class="flash-inner"></div>');
  var front = h('<div class="flash-face flash-front"><p class="flash-name">' + escapeHtml(cardData.name) + '</p><p class="flash-hint">Tap to reveal</p></div>');
  var back = document.createElement("div");
  back.className = "flash-face flash-back";
  back.innerHTML = '<p class="flash-name small">' + escapeHtml(cardData.name) + "</p>" + cardData.backHtml;
  inner.appendChild(front);
  inner.appendChild(back);
  outer.appendChild(inner);
  outer.addEventListener("click", function () { outer.classList.toggle("flipped"); });
  return outer;
}

function startObjectiveFlash(mode, cardList) {
  var cards = shuffle(cardList || mode.data);
  var wrap = document.createElement("div");
  var bar = h('<div class="topbar"></div>');
  bar.appendChild(homeLink());
  bar.appendChild(h('<div class="topbar-label">' + cards.length + " objectives</div>"));
  wrap.appendChild(bar);
  wrap.appendChild(h('<div class="intro-card"><p class="intro-kicker">' + escapeHtml(mode.group) + ' objectives</p>' +
    '<p class="intro-text">Each card front is a learning objective. Try to say the answer out loud, then tap to flip and check. Mark it \u201cI know it\u201d or \u201cDon\u2019t know,\u201d and review the ones you miss at the bottom.</p></div>'));

  var live = makeLiveScore(cards.length);
  wrap.appendChild(live.el);

  var missed = [];
  var reviewBtn = h('<button type="button" class="link-btn" disabled>Review the ones I don\'t know</button>');

  var grid = h('<div class="flash-grid wide"></div>');
  cards.forEach(function (cardData) {
    var cell = h('<div></div>');
    var flash = buildObjCard(cardData);
    cell.appendChild(flash);
    var btnRow = h('<div class="start-bar" style="margin-top:12px;justify-content:center;gap:10px" hidden></div>');
    var knowBtn = h('<button type="button" class="flash-btn know">I know it</button>');
    var missBtn = h('<button type="button" class="flash-btn miss">Don\'t know</button>');
    btnRow.appendChild(knowBtn);
    btnRow.appendChild(missBtn);
    cell.appendChild(btnRow);

    flash.addEventListener("click", function () {
      if (flash.classList.contains("flipped")) btnRow.hidden = false;
    });

    var unit = {};
    function grade(knew) {
      knowBtn.classList.toggle("checked", knew);
      missBtn.classList.toggle("checked", !knew);
      var idx = missed.indexOf(cardData);
      if (!knew && idx === -1) missed.push(cardData);
      if (knew && idx !== -1) missed.splice(idx, 1);
      reviewBtn.disabled = missed.length === 0;
      return { right: knew ? 1 : 0, total: 1 };
    }
    knowBtn.addEventListener("click", function () { live.apply(unit, grade(true)); });
    missBtn.addEventListener("click", function () { live.apply(unit, grade(false)); });
    grid.appendChild(cell);
  });
  wrap.appendChild(grid);

  var sb = h('<div class="start-bar" style="margin-top:26px"></div>');
  var again = h('<button type="button" class="stamp-btn"><span>Shuffle and start over</span></button>');
  again.addEventListener("click", function () { startObjectiveFlash(mode); });
  sb.appendChild(again);
  wrap.appendChild(sb);
  reviewBtn.addEventListener("click", function () { if (missed.length) startObjectiveFlash(mode, missed.slice()); });
  var nav = h('<div class="nav-row"></div>');
  nav.appendChild(reviewBtn);
  wrap.appendChild(nav);
  render(wrap);
}

/* ---------- Cash Flows: operating section, indirect (Rainbow Company) ---------- */
function makeRainbow() {
  var tries = 0;
  while (tries < 8000) {
    tries++;
    var sales = rnd(250, 520, 1) * 1000;
    var divIncome = rnd(3, 15, 1) * 500;
    var totalRev = sales + divIncome;
    var cogs = Math.round(sales * rnd(50, 62, 1) / 100 / 500) * 500;
    var wages = Math.round(sales * rnd(12, 22, 1) / 100 / 500) * 500;
    var dep = rnd(16, 50, 1) * 500;
    var amort = rnd(3, 12, 1) * 500;
    var interest = rnd(6, 18, 1) * 500;
    var tax = rnd(16, 44, 1) * 500;
    var lossEquip = rnd(2, 10, 1) * 500;
    var gainInv = rnd(2, 10, 1) * 500;
    var totalExp = cogs + wages + dep + amort + interest + tax + lossEquip - gainInv;
    var ni = totalRev - totalExp;
    function acct(lo, hi, dlo, dhi) { var beg = rnd(lo, hi, 1) * 500; var d = (Math.random() < 0.5 ? -1 : 1) * rnd(dlo, dhi, 1) * 500; return { beg: beg, end: beg + d, d: d }; }
    var AR = acct(20, 60, 2, 20), Inv = acct(60, 110, 4, 26), Pre = acct(4, 14, 1, 6);
    var AP = acct(14, 40, 2, 14), IntPay = acct(3, 10, 1, 4), TaxPay = acct(6, 16, 1, 6);
    var Cash = acct(10, 40, 2, 16);
    var op = ni + dep + amort + lossEquip - gainInv - AR.d - Inv.d - Pre.d + AP.d + IntPay.d + TaxPay.d;
    var ok = ni > 15000 && op > 8000 &&
      AR.end > 2000 && Inv.end > 6000 && Pre.end > 500 && AP.end > 2000 && IntPay.end > 500 && TaxPay.end > 500 && Cash.end > 2000;
    if (ok) return { sales:sales,divIncome:divIncome,totalRev:totalRev,cogs:cogs,wages:wages,dep:dep,amort:amort,interest:interest,tax:tax,lossEquip:lossEquip,gainInv:gainInv,totalExp:totalExp,ni:ni,AR:AR,Inv:Inv,Pre:Pre,AP:AP,IntPay:IntPay,TaxPay:TaxPay,Cash:Cash,op:op };
  }
}

  wrap.appendChild(newNumbersBtn(function () { startOperatingCFProblem(mode); }));
  wrap.appendChild(makeReveal(ak));
  render(wrap);
}

var DIRECT_COMPANIES = ["Skyline Company", "Meridian Company", "Delta Supply Co.", "Anchor Company", "Fairview Company"];
function makeDirect() {
  var tries = 0;
  while (tries < 12000) {
    tries++;
    var sales = rnd(200, 450, 1) * 1000;
    var cogs = Math.round(sales * rnd(52, 64, 1) / 100 / 500) * 500;
    var wages = Math.round(sales * rnd(10, 18, 1) / 100 / 500) * 500;
    var ins = rnd(6, 20, 1) * 500;
    var rent = rnd(8, 26, 1) * 500;
    var dep = rnd(14, 44, 1) * 500;
    var interest = rnd(4, 16, 1) * 500;
    var tax = rnd(10, 40, 1) * 500;
    var ni = sales - cogs - wages - ins - rent - dep - interest - tax;
    function acct(lo, hi, dlo, dhi) { var beg = rnd(lo, hi, 1) * 500; var d = (Math.random() < 0.5 ? -1 : 1) * rnd(dlo, dhi, 1) * 500; return { beg: beg, end: beg + d, d: d }; }
    var AR = acct(20, 60, 2, 18), Inv = acct(50, 100, 4, 24), PreIns = acct(4, 14, 1, 5), PreRent = acct(4, 16, 1, 6);
    var AP = acct(14, 40, 2, 14), WagesPay = acct(4, 16, 1, 6), IntPay = acct(2, 8, 1, 3), TaxPay = acct(4, 14, 1, 5);
    var cust = sales - AR.d, supp = cogs + Inv.d - AP.d, wagesCash = wages - WagesPay.d, insCash = ins + PreIns.d, rentCash = rent + PreRent.d, intCash = interest - IntPay.d, taxCash = tax - TaxPay.d;
    var op = cust - supp - wagesCash - insCash - rentCash - intCash - taxCash;

    // noncurrent + equity, full balance sheet
    var PPEbeg = rnd(150, 350, 1) * 1000;
    var purchases = rnd(0, 60, 1) * 1000;
    var PPEend = PPEbeg + purchases - dep;
    var Landbeg = rnd(20, 120, 1) * 1000;
    var Landend = Landbeg + rnd(0, 40, 1) * 1000;
    var LTDbeg = rnd(60, 200, 1) * 1000;
    var LTDend = LTDbeg + (Math.random() < 0.5 ? -1 : 1) * rnd(0, 40, 1) * 1000;
    var CSbeg = rnd(80, 200, 1) * 1000;
    var CSend = CSbeg + rnd(0, 40, 1) * 1000;
    var REbeg = rnd(30, 150, 1) * 1000;
    var div = rnd(2, 30, 1) * 1000;
    var REend = REbeg + ni - div;

    function cashPlug(cur, sfx) {
      var liabEq = cur.AP + cur.WagesPay + cur.IntPay + cur.TaxPay + cur.LTD + cur.CS + cur.RE;
      var noncash = cur.AR + cur.Inv + cur.PreIns + cur.PreRent + cur.PPE + cur.Land;
      return liabEq - noncash;
    }
    var begCash = cashPlug({AP:AP.beg,WagesPay:WagesPay.beg,IntPay:IntPay.beg,TaxPay:TaxPay.beg,LTD:LTDbeg,CS:CSbeg,RE:REbeg,AR:AR.beg,Inv:Inv.beg,PreIns:PreIns.beg,PreRent:PreRent.beg,PPE:PPEbeg,Land:Landbeg});
    var endCash = cashPlug({AP:AP.end,WagesPay:WagesPay.end,IntPay:IntPay.end,TaxPay:TaxPay.end,LTD:LTDend,CS:CSend,RE:REend,AR:AR.end,Inv:Inv.end,PreIns:PreIns.end,PreRent:PreRent.end,PPE:PPEend,Land:Landend});

    var ok = ni > 10000 && op > 6000 && div < ni && REend > 5000 && LTDend > 20000 && PPEend > 60000 &&
      cust > 0 && supp > 0 && wagesCash > 0 && insCash > 0 && rentCash > 0 && intCash > 0 && taxCash > 0 &&
      AR.end > 2000 && Inv.end > 6000 && PreIns.end > 500 && PreRent.end > 500 &&
      AP.end > 2000 && WagesPay.end > 500 && IntPay.end > 300 && TaxPay.end > 500 &&
      begCash > 8000 && begCash < 110000 && endCash > 8000 && endCash < 110000;
    if (ok) return { sales:sales,cogs:cogs,wages:wages,ins:ins,rent:rent,dep:dep,interest:interest,tax:tax,ni:ni,
      AR:AR,Inv:Inv,PreIns:PreIns,PreRent:PreRent,AP:AP,WagesPay:WagesPay,IntPay:IntPay,TaxPay:TaxPay,
      cust:cust,supp:supp,wagesCash:wagesCash,insCash:insCash,rentCash:rentCash,intCash:intCash,taxCash:taxCash,op:op,
      PPEbeg:PPEbeg,PPEend:PPEend,Landbeg:Landbeg,Landend:Landend,LTDbeg:LTDbeg,LTDend:LTDend,CSbeg:CSbeg,CSend:CSend,REbeg:REbeg,REend:REend,div:div,begCash:begCash,endCash:endCash };
  }
}

/* ---------- Transactions to Financial Statements (Paul's Photography) ---------- */
function makePaul() {
  var tries = 0, p;
  while (tries < 6000) {
    tries++;
    var stock = rnd(6, 30, 1) * 1000;
    var loan = rnd(3, 12, 1) * 1000;
    var landTotal = rnd(6, 20, 1) * 1000;
    var rent = rnd(2, 8, 1) * 500;
    var svcCash = rnd(6, 20, 1) * 1000;
    var svcAr = rnd(2, 10, 1) * 500;
    var misc = rnd(2, 8, 1) * 500;
    var parcelCost = Math.round(landTotal * rnd(25, 50, 1) / 100 / 500) * 500;
    var isGain = Math.random() < 0.5;
    var deltaLand = rnd(1, 8, 1) * 100;
    var parcelPrice = isGain ? parcelCost + deltaLand : parcelCost - deltaLand;
    var gainLoss = parcelPrice - parcelCost;
    var rev = svcCash + svcAr;
    var ni = rev - rent - misc + gainLoss;
    var maxDiv = ni > 0 ? Math.floor(ni / 100) : 0;
    var div = rnd(2, Math.min(maxDiv, 40), 1) * 100;
    var re = ni - div;
    var cash = stock + loan - landTotal - rent + svcCash - misc + parcelPrice - div;
    var ar = svcAr, land = landTotal - parcelCost;
    var ta = cash + ar + land, tle = loan + stock + re;
    var ok = ni > 800 && re > 200 && cash > 1000 && land > 1000 && parcelCost < landTotal &&
      parcelPrice > 300 && div < ni && ta === tle;
    if (ok) return { stock:stock,loan:loan,landTotal:landTotal,rent:rent,svcCash:svcCash,svcAr:svcAr,misc:misc,
      parcelCost:parcelCost,parcelPrice:parcelPrice,gainLoss:gainLoss,isGain:isGain,rev:rev,ni:ni,div:div,re:re,
      cash:cash,ar:ar,land:land,ta:ta,tle:tle };
  }
  return p;
}

/* ---------- Preparing Adjusting Entries (Kwik Print) ---------- */
var KWIK_WEEKDAYS = [{ n: "Monday", d: 1 }, { n: "Tuesday", d: 2 }, { n: "Wednesday", d: 3 }, { n: "Thursday", d: 4 }];
var KWIK_ADFRAC = [{ t: "One-third", f: 1 / 3, m: 3 }, { t: "One-half", f: 1 / 2, m: 2 }, { t: "One-fourth", f: 1 / 4, m: 4 }, { t: "Two-thirds", f: 2 / 3, m: 3 }];

/* ---------- Closing Entries (adjusted trial balance) ---------- */
function makeClosing() {
  var tries = 0;
  while (tries < 9000) {
    tries++;
    var wages = rnd(80, 160, 1) * 500;
    var rent = rnd(20, 60, 1) * 500;
    var insurance = rnd(6, 20, 1) * 400;
    var suppExp = rnd(10, 30, 1) * 400;
    var advExp = rnd(8, 30, 1) * 400;
    var deprT = rnd(8, 24, 1) * 500;
    var deprE = rnd(2, 10, 1) * 400;
    var totalExp = wages + rent + insurance + suppExp + advExp + deprT + deprE;
    var ni = rnd(20, 80, 1) * 500;
    var revenue = totalExp + ni;
    var cash = rnd(6, 20, 1) * 500, ar = rnd(12, 40, 1) * 500, supplies = rnd(6, 20, 1) * 200, prepaidAdv = rnd(6, 20, 1) * 400;
    var trucks = rnd(80, 140, 1) * 500, equipment = rnd(20, 50, 1) * 400;
    var accumT = rnd(20, 60, 1) * 500, accumE = rnd(4, 20, 1) * 400;
    var ap = rnd(4, 30, 1) * 200, scl = rnd(6, 30, 1) * 200, cs = rnd(10, 40, 1) * 500;
    var lhsBs = cash + ar + supplies + prepaidAdv + trucks + equipment;
    var otherCr = accumT + accumE + ap + scl + cs;
    var re = lhsBs - otherCr - ni;
    var totalDr = lhsBs + totalExp;
    var totalCr = otherCr + re + revenue;
    var ok = re > 4000 && accumT < trucks && accumE < equipment && ni > 8000 && totalDr === totalCr;
    if (ok) return { wages:wages,rent:rent,insurance:insurance,suppExp:suppExp,advExp:advExp,deprT:deprT,deprE:deprE,totalExp:totalExp,ni:ni,revenue:revenue,
      cash:cash,ar:ar,supplies:supplies,prepaidAdv:prepaidAdv,trucks:trucks,equipment:equipment,accumT:accumT,accumE:accumE,ap:ap,scl:scl,cs:cs,re:re,totalDr:totalDr,totalCr:totalCr };
  }
}

  reCard.appendChild(h('<p class="ak-method">Ending Retained Earnings</p>'));
  reCard.innerHTML += '<div style="overflow-x:auto"><table class="ak-table"><tbody>' +

  ak.appendChild(reCard);

  var notes = h('<div class="ak-card"></div>');
  notes.innerHTML = '<p class="ak-method">How closing works</p>' +
    '<p class="ak-note"><strong>Only temporary accounts get closed:</strong> revenues, expenses, and dividends. Their balances are reset to zero so the next period starts fresh. Permanent accounts (assets, liabilities, common stock, retained earnings) carry forward and are never closed. There is no dividends account here, so there are just two entries.</p>' +
    '<p class="ak-note"><strong>Revenue has a credit balance,</strong> so you debit it to bring it to zero, with the offset credited to Retained Earnings.</p>' +

/* ---------- Calculating Ratios (Target-style structure, randomized) ---------- */
var RATIO_COMPANIES = ["Redwood Retail", "Cornerstone Stores", "Brightline Retail", "Harbor Point Retail", "Cedar & Co.", "Northgate Retail"];
function makeRatios() {
  var tries = 0;
  while (tries < 8000) {
    tries++;
    function y() {
      var cash=rnd(15,40,1)*100, inv=rnd(60,120,1)*100, oca=rnd(10,20,1)*100;
      var tca=cash+inv+oca;
      var ppe=rnd(200,300,1)*100, lease=rnd(15,30,1)*100, onca=rnd(8,18,1)*100;
      var ta=tca+ppe+lease+onca;
      var ap=rnd(70,120,1)*100, accr=rnd(30,50,1)*100, cpltd=rnd(2,20,1)*100;
      var tcl=ap+accr+cpltd;
      var ltd=rnd(80,140,1)*100, nclease=rnd(15,28,1)*100, dit=rnd(8,15,1)*100, oncl=rnd(12,20,1)*100;
      var tncl=ltd+nclease+dit+oncl;
      var tl=tcl+tncl, se=ta-tl;
      return {cash:cash,inv:inv,oca:oca,tca:tca,ppe:ppe,lease:lease,onca:onca,ta:ta,ap:ap,accr:accr,cpltd:cpltd,tcl:tcl,ltd:ltd,nclease:nclease,dit:dit,oncl:oncl,tncl:tncl,tl:tl,se:se};
    }
    var cur=y(), pri=y();
    var sales=rnd(600,900,1)*100;
    var costSales=Math.round(sales*rnd(66,74,1)/100);
    var sga=Math.round(sales*rnd(18,24,1)/100);
    var da=rnd(18,32,1)*100;
    var opInc=sales-costSales-sga-da;
    var interest=rnd(30,60,1)*10;
    var other=rnd(-15,15,1);
    var ebt=opInc-interest-other;
    var taxRate=rnd(20,26,1)/100;
    var tax=Math.round(ebt*taxRate);
    var niCont=ebt-tax;
    var disc=rnd(0,30,1);
    var ni=niCont+disc;
    var ok = cur.se>4000 && pri.se>4000 && opInc>1500 && ebt>1000 && niCont>500 && cur.tl>cur.se && sales>costSales+sga+da;
    if (ok) return {company:pick(RATIO_COMPANIES),cur:cur,pri:pri,sales:sales,costSales:costSales,sga:sga,da:da,opInc:opInc,interest:interest,other:other,ebt:ebt,tax:tax,taxRate:taxRate,niCont:niCont,disc:disc,ni:ni};
  }
}
function pct(x) { return (x * 100).toFixed(1) + "%"; }
function dec(x) { return x.toFixed(2); }
function startRatiosProblem(mode) {
  var p = makeRatios();
  var c = p.cur, pr = p.pri;
  var wrap = problemTopbar();

  var probCard = h('<div class="fs-card"></div>');
  probCard.appendChild(h('<p class="prob-title">Calculating Ratios: ' + escapeHtml(p.company) + '</p>'));
  probCard.appendChild(h('<p class="prob-instr">Use the balance sheet and income statement below to calculate the ratios listed underneath. All figures are in $ millions.</p>'));

  var bs = h('<div class="fs-wrap"></div>');
  bs.innerHTML = '<table class="fs-table two-col"><tbody>' +
    '<tr class="head"><td class="lbl section">($ millions)</td><td class="amt">Current year</td><td class="amt">Prior year</td></tr>' +
    '<tr class="head"><td class="lbl">Assets</td><td class="amt"></td><td class="amt"></td></tr>' +
    row("Cash and cash equivalents", dollar(c.cash), dollar(pr.cash)) +
    row("Inventory", fmt(c.inv), fmt(pr.inv)) +
    row("Other current assets", fmt(c.oca), fmt(pr.oca), "rule") +
    row("Total current assets", fmt(c.tca), fmt(pr.tca), "indent") +
    row("Property and equipment, net", fmt(c.ppe), fmt(pr.ppe)) +
    row("Operating lease assets", fmt(c.lease), fmt(pr.lease)) +
    row("Other noncurrent assets", fmt(c.onca), fmt(pr.onca), "rule") +
    row("Total assets", dollar(c.ta), dollar(pr.ta), "indent grand") +
    spacer() +
    '<tr class="head"><td class="lbl">Liabilities and shareholders\u2019 investment</td><td class="amt"></td><td class="amt"></td></tr>' +
    row("Accounts payable", dollar(c.ap), dollar(pr.ap)) +
    row("Accrued and other current liabilities", fmt(c.accr), fmt(pr.accr)) +
    row("Current portion of long-term debt", fmt(c.cpltd), fmt(pr.cpltd), "rule") +
    row("Total current liabilities", fmt(c.tcl), fmt(pr.tcl), "indent") +
    row("Long-term debt and other borrowings", fmt(c.ltd), fmt(pr.ltd)) +
    row("Noncurrent operating lease liabilities", fmt(c.nclease), fmt(pr.nclease)) +
    row("Deferred income taxes", fmt(c.dit), fmt(pr.dit)) +
    row("Other noncurrent liabilities", fmt(c.oncl), fmt(pr.oncl), "rule") +
    row("Total noncurrent liabilities", fmt(c.tncl), fmt(pr.tncl), "indent") +
    row("Total shareholders\u2019 investment", fmt(c.se), fmt(pr.se), "rule") +
    row("Total liabilities and shareholders\u2019 investment", dollar(c.ta), dollar(pr.ta), "indent grand") +
    '</tbody></table>';
  probCard.appendChild(bs);

  var is = h('<div class="fs-wrap" style="margin-top:26px"></div>');
  is.innerHTML = '<table class="fs-table"><tbody>' +
    '<tr class="head"><td class="lbl section">($ millions)</td><td class="amt">Current fiscal year</td></tr>' +
    row1("Sales", dollar(p.sales)) +
    row1("Cost of sales", fmt(p.costSales)) +
    row1("Selling, general, and administrative expenses", fmt(p.sga)) +
    row1("Depreciation and amortization", fmt(p.da), "rule") +
    row1("Operating income", fmt(p.opInc), "total") +
    row1("Net interest expense", fmt(p.interest)) +
    row1("Net other (income)/expense", (p.other < 0 ? "(" + fmt(-p.other) + ")" : fmt(p.other)), "rule") +
    row1("Earnings before income taxes", fmt(p.ebt), "total") +
    row1("Provision for income taxes", fmt(p.tax), "rule") +
    row1("Net earnings from continuing operations", fmt(p.niCont), "total") +
    row1("Discontinued operations, net of tax", fmt(p.disc), "rule") +
    row1("Net earnings", dollar(p.ni), "grand") +
    '</tbody></table>';
  probCard.appendChild(is);

  probCard.appendChild(h('<p class="prob-instr" style="margin:24px 0 0"><strong>Calculate the following ratios for the current fiscal year.</strong> Use average balances (beginning + ending, \u00f7 2) for the balance sheet figures in the return and turnover ratios. The company\u2019s tax rate is <strong>' + pct(p.taxRate) + '</strong> (needed for EWI).</p>'));
  probCard.appendChild(h('<ol class="rat-list">' +
    '<li>EWI (earnings without interest)</li><li>Gross profit margin</li><li>Profit margin</li>' +
    '<li>Return on assets (ROA)</li><li>Return on equity (ROE)</li><li>Asset turnover rate</li>' +
    '<li>Inventory turnover</li><li>PP&amp;E turnover</li><li>Current ratio</li><li>Working capital</li>' +
    '<li>Debt-to-equity</li><li>Times interest earned</li>' +
    '</ol>'));
  wrap.appendChild(probCard);

  // computed answers
  var avgTA = (c.ta + pr.ta) / 2, avgSE = (c.se + pr.se) / 2, avgInv = (c.inv + pr.inv) / 2, avgPPE = (c.ppe + pr.ppe) / 2;
  var taxRate = p.taxRate;
  var atInt = p.interest * (1 - taxRate);
  var ewi = p.ni + atInt;

  var ak = h('<div class="answer-key"></div>');
  ak.appendChild(h('<p class="answer-key-head">Answer Key</p>'));
  ak.appendChild(h('<p class="answer-key-sub">EWI is the building block for several ratios below. Using the given tax rate of ' + pct(taxRate) + ': EWI = ' + fmt(p.ni) + ' + [' + fmt(p.interest) + ' \u00d7 (1 \u2212 ' + dec(taxRate) + ')] = <strong style="color:var(--ink)">' + fmt(Math.round(ewi)) + '</strong>.</p>'));

  var card = h('<div class="ak-card"></div>');
  card.appendChild(h('<p class="ak-method">Ratio Calculations</p>'));
  card.innerHTML +=
    ratBlock("1. EWI (earnings without interest)", "Net income + [Interest expense \u00d7 (1 \u2212 Tax rate)]",
      '<span class="num">' + fmt(p.ni) + ' + [' + fmt(p.interest) + ' \u00d7 (1 \u2212 ' + dec(taxRate) + ')] = ' + fmt(p.ni) + ' + ' + fmt(Math.round(atInt)) + '</span>',
      "= $" + fmt(Math.round(ewi)) + " million") +
    ratBlock("2. Gross profit margin", "(Sales \u2212 Cost of goods sold) \u00f7 Sales",
      '<span class="num">(' + fmt(p.sales) + ' \u2212 ' + fmt(p.costSales) + ') \u00f7 ' + fmt(p.sales) + '</span>',
      "= " + pct((p.sales - p.costSales) / p.sales)) +
    ratBlock("3. Profit margin", "EWI \u00f7 Sales",
      '<span class="num">' + fmt(Math.round(ewi)) + ' \u00f7 ' + fmt(p.sales) + '</span>',
      "= " + pct(ewi / p.sales)) +
    ratBlock("4. Return on assets (ROA)", "EWI \u00f7 Average total assets",
      '<span class="num">' + fmt(Math.round(ewi)) + ' \u00f7 [(' + fmt(c.ta) + ' + ' + fmt(pr.ta) + ') \u00f7 2] = ' + fmt(Math.round(ewi)) + ' \u00f7 ' + fmt(avgTA) + '</span>',
      "= " + pct(ewi / avgTA)) +
    ratBlock("5. Return on equity (ROE)", "Net income \u00f7 Average stockholders\u2019 equity",
      '<span class="num">' + fmt(p.ni) + ' \u00f7 [(' + fmt(c.se) + ' + ' + fmt(pr.se) + ') \u00f7 2] = ' + fmt(p.ni) + ' \u00f7 ' + fmt(avgSE) + '</span>',
      "= " + pct(p.ni / avgSE)) +
    ratBlock("6. Asset turnover rate", "Sales \u00f7 Average total assets",
      '<span class="num">' + fmt(p.sales) + ' \u00f7 ' + fmt(avgTA) + '</span>',
      "= " + dec(p.sales / avgTA)) +
    ratBlock("7. Inventory turnover", "Cost of goods sold \u00f7 Average inventory",
      '<span class="num">' + fmt(p.costSales) + ' \u00f7 [(' + fmt(c.inv) + ' + ' + fmt(pr.inv) + ') \u00f7 2] = ' + fmt(p.costSales) + ' \u00f7 ' + fmt(avgInv) + '</span>',
      "= " + dec(p.costSales / avgInv) + " times") +
    ratBlock("8. PP&E turnover", "Sales \u00f7 Average PP&E",
      '<span class="num">' + fmt(p.sales) + ' \u00f7 [(' + fmt(c.ppe) + ' + ' + fmt(pr.ppe) + ') \u00f7 2] = ' + fmt(p.sales) + ' \u00f7 ' + fmt(avgPPE) + '</span>',
      "= " + dec(p.sales / avgPPE) + " times") +
    ratBlock("9. Current ratio", "Current assets \u00f7 Current liabilities",
      '<span class="num">' + fmt(c.tca) + ' \u00f7 ' + fmt(c.tcl) + '</span>  (prior year: ' + fmt(pr.tca) + ' \u00f7 ' + fmt(pr.tcl) + ' = ' + dec(pr.tca / pr.tcl) + ')',
      "= " + dec(c.tca / c.tcl)) +
    ratBlock("10. Working capital", "Current assets \u2212 Current liabilities",
      '<span class="num">' + fmt(c.tca) + ' \u2212 ' + fmt(c.tcl) + '</span>',
      "= " + (c.tca - c.tcl < 0 ? "\u2212$" + fmt(Math.abs(c.tca - c.tcl)) : "$" + fmt(c.tca - c.tcl)) + " million") +
    ratBlock("11. Debt-to-equity", "Total liabilities \u00f7 Stockholders\u2019 equity",
      '<span class="num">' + fmt(c.tl) + ' \u00f7 ' + fmt(c.se) + '</span>  (total liabilities = ' + fmt(c.ta) + ' total assets \u2212 ' + fmt(c.se) + ' equity)',
      "= " + dec(c.tl / c.se)) +
    ratBlock("12. Times interest earned", "(Net income + Tax expense + Interest expense) \u00f7 Interest expense",
      '<span class="num">(' + fmt(p.ni) + ' + ' + fmt(p.tax) + ' + ' + fmt(p.interest) + ') \u00f7 ' + fmt(p.interest) + ' = ' + fmt(p.ni + p.tax + p.interest) + ' \u00f7 ' + fmt(p.interest) + '</span>',
      "= " + dec((p.ni + p.tax + p.interest) / p.interest) + " times");
  ak.appendChild(card);

  var notes = h('<div class="ak-card"></div>');
  notes.innerHTML = '<p class="ak-method">Things to watch</p>' +
    '<p class="ak-note"><strong>Averages vs. point-in-time.</strong> Return and turnover ratios pair a full-year income statement flow with a single-day balance sheet snapshot, so you average beginning and ending balances. Current ratio, working capital, and debt-to-equity are balance sheet vs. balance sheet, so they use one date, no averaging.</p>' +
    '<p class="ak-note"><strong>EWI is the tricky one.</strong> ROA and profit margin use EWI, not plain net income, so financing choices don\u2019t distort the measure. EWI adds back interest, but only the after-tax cost, which is why you multiply by (1 \u2212 tax rate).</p>' +
    '<p class="ak-note"><strong>Four flashcard ratios can\u2019t be done here.</strong> Accounts receivable turnover and the quick ratio both need accounts receivable, which is folded into \u201cother current assets.\u201d Operating cash flow to current liabilities needs the cash flow statement, and cash burn rate needs free cash flow, and neither is given.</p>';
  ak.appendChild(notes);

  wrap.appendChild(newNumbersBtn(function () { startRatiosProblem(mode); }));
  wrap.appendChild(makeReveal(ak));
  render(wrap);
}
function ratBlock(name, formula, work, result) {
  return '<div class="rat"><p class="rat-name">' + escapeHtml(name) + '</p>' +
    '<p class="rat-line">' + formula + '</p>' +
    '<p class="rat-line">' + work + '</p>' +
    '<p class="rat-result">' + result + '</p></div>';
}


/* =========================================================
   SHARED: live self-grade tally
   ========================================================= */
function makeLiveScore(totalBoxes) {
  var checkedBoxes = 0, rightBoxes = 0;
  var el = h('<div class="live-score"></div>');
  function renderScore() {
    el.textContent = checkedBoxes === 0
      ? totalBoxes + (totalBoxes === 1 ? " card to review" : " cards to review")
      : rightBoxes + " known, " + (checkedBoxes - rightBoxes) + " to study, " + (totalBoxes - checkedBoxes) + " left";
  }
  renderScore();
  function apply(unit, res) {
    rightBoxes += res.right - (unit._lastRight || 0);
    checkedBoxes += res.total - (unit._lastTotal || 0);
    unit._lastRight = res.right;
    unit._lastTotal = res.total;
    renderScore();
  }
  return { el: el, apply: apply };
}
